name: Temporary verified release transfer
on:
  push:
    branches: [codex/ship-10-1-104]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-72b8-8208-addf-57cef13a62d9/raw?se=2026-10-11T03%3A36%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=4ffb44d1-0111-402b-a8e1-2a45bf235f60&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A04%3A50Z&ske=2026-10-12T02%3A04%3A50Z&sks=b&skv=2026-02-06&sig=kY6edcytYJ10VX0PtbrhMDumBIfNkpyGzhiGLaw67t0%3D"
    steps:
      - name: Verify and publish v10.1.104
        shell: bash
        run: |
          set -euo pipefail
          repo=jwmvw5tmk2-oss/walaa-ai-releases
          tag=v10.1.104
          curl --fail --location --retry 4 --retry-all-errors --output artifact.zip "$ARTIFACT_URL"
          echo 'ad30db64f5636586560474d6b565e338151fdd2f32d1f96c520c2b70bd982a6d  artifact.zip' | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          cd artifact
          cat > expected.sha256 <<'HASHES'
          cdd6d325f6914202086b1ceff9bd3d918ea297af1661aaf3d2f3465b39297958  WALAA-AI-Windows-x64-v10.1.104.exe
          1deed801ea1601cc670fc699633ccb3c338141293695db761340c3005b2ffa0c  WALAA-AI-Setup-v10.1.104.exe
          2383bc1b72e135863cd1a66a6eab043bed8705966ef1916e94c538424ef60da5  User/WALAA-AI-User-Windows-x64-v10.1.104.exe
          c23e28a4c00fdb92c0139c7314745cb3812c5ef24827c0346e9f4d78d9ea5705  User/WALAA-AI-User-Setup-v10.1.104.exe
          HASHES
          sha256sum -c expected.sha256
          if gh release view "$tag" --repo "$repo" --json isDraft >/tmp/release-view.json 2>/tmp/release-view.err; then
            test "$(jq -r .isDraft /tmp/release-view.json)" = true
          else
            grep -qi 'release not found' /tmp/release-view.err
            gh release create "$tag" --repo "$repo" --target main --draft --title 'WALAA AI v10.1.104' --notes 'WALAA AI v10.1.104'
          fi
          gh release upload "$tag" WALAA-AI-Windows-x64-v10.1.104.exe WALAA-AI-Setup-v10.1.104.exe User/WALAA-AI-User-Windows-x64-v10.1.104.exe User/WALAA-AI-User-Setup-v10.1.104.exe --repo "$repo" --clobber
          mkdir ../checked
          gh release download "$tag" --repo "$repo" --dir ../checked --pattern '*.exe'
          sed -e 's#  User/#  ../checked/#' -e 's#  WALAA-AI-#  ../checked/WALAA-AI-#' expected.sha256 | sha256sum -c -
          cat > latest.json <<'OWNER'
          {
            "version": "10.1.104",
            "download_url": "https://github.com/jwmvw5tmk2-oss/walaa-ai-releases/releases/download/v10.1.104/WALAA-AI-Windows-x64-v10.1.104.exe",
            "sha256": "cdd6d325f6914202086b1ceff9bd3d918ea297af1661aaf3d2f3465b39297958",
            "size_bytes": 14913536,
            "notes": "v10.1.104",
            "published_at": "2026-10-10T20:51:55Z",
            "channel": "stable",
            "release_id": "walaa-10.1.104-cdd6d325f691",
            "locked_checkpoint_sha256": "883ac8f78b782933c6f67d34e216114e0bf166262732be214c3340fa5797b1b9"
          }
          OWNER
          cat > latest-user.json <<'USER'
          {
            "version": "10.1.104",
            "download_url": "https://github.com/jwmvw5tmk2-oss/walaa-ai-releases/releases/download/v10.1.104/WALAA-AI-User-Windows-x64-v10.1.104.exe",
            "sha256": "2383bc1b72e135863cd1a66a6eab043bed8705966ef1916e94c538424ef60da5",
            "size_bytes": 14913536,
            "notes": "v10.1.104",
            "published_at": "2026-10-10T20:51:55Z",
            "channel": "stable",
            "release_id": "walaa-10.1.104-2383bc1b72e1",
            "locked_checkpoint_sha256": "883ac8f78b782933c6f67d34e216114e0bf166262732be214c3340fa5797b1b9"
          }
          USER
          gh release upload "$tag" latest.json latest-user.json --repo "$repo" --clobber
          mkdir ../checked-manifests
          gh release download "$tag" --repo "$repo" --dir ../checked-manifests --pattern 'latest*.json'
          cmp latest.json ../checked-manifests/latest.json
          cmp latest-user.json ../checked-manifests/latest-user.json
          gh release edit "$tag" --repo "$repo" --draft=false --latest
          test "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" = "$tag"
          echo 'VERIFIED_PUBLIC_RELEASE_v10.1.104'
